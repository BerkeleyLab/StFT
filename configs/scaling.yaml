dataset: /pscratch/sd/m/mcho4/StFT-data-parellel-new/data/shallow-water/dataset.h5

patch_sizes:
  - [128, 128]
  - [64, 64]
  - [32, 32]
overlaps:
  - [1, 1]
  - [1, 1]
  - [1, 1]
vit_depth: [6, 6, 6]
modes:
  - [8, 8]
  - [8, 8]
  - [8, 8]

dim: 512
num_heads: 1
lr: 1.0e-4
max_epochs: 20
batchsize: 16
cond_time: 5
lift_channel: 64
act: gelu

save_path: /pscratch/sd/m/mcho4/StFT-data-parellel-new/experiments/scaling/
save_every_n: 5
validate_every_n: 10

condition_blocks: true
use_snapshots: true
snapshot_length: 20

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
